<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioNest - Product Catalogue (REST API)</title>
<style>
  body { font-family: Arial, sans-serif; background:#f5f7f1; color:#1d2b22; margin:0; padding:20px; }
  h1 { color:#2e5a3c; margin:0; }
  .panel { background:#fff; border:1px solid #d8dfd2; border-radius:8px; padding:14px; margin:14px 0; max-width:760px; }
  input, textarea { width:100%; padding:8px; margin:4px 0 10px; box-sizing:border-box; border:1px solid #c9d3c0; border-radius:4px; font:inherit; }
  button { padding:7px 14px; border:0; border-radius:4px; cursor:pointer; background:#2e5a3c; color:#fff; }
  button.del { background:#c0392b; }
  button.alt { background:#b98b55; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #e3e9dc; vertical-align:top; }
  #status { padding:8px 12px; border-radius:4px; max-width:760px; }
  .ok { background:#dff0d8; } .err { background:#f8d7da; } .info { background:#e8eef6; }
  .tbl-wrap { overflow-x:auto; }
</style>
</head>
<body>
<h1>BioNest Product Catalogue</h1>
<p>Biodegradable packaging solutions &ndash; managed through a REST endpoint (CRUD).</p>
<div id="status" class="info">Loading...</div>

<div class="panel">
  <h3 id="formTitle">Add product</h3>
  <label for="pName">Product name</label>
  <input id="pName" maxlength="80">
  <label for="pDesc">Description</label>
  <textarea id="pDesc" rows="2" maxlength="200"></textarea>
  <button id="saveBtn" type="button">Add product</button>
  <button id="cancelBtn" class="alt" type="button" hidden>Cancel edit</button>
</div>

<div class="panel tbl-wrap">
  <table>
    <thead><tr><th>ID</th><th>Product</th><th>Description</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
  // JSONPlaceholder is a free test API. It accepts POST/PUT/DELETE but does NOT really save them.
  // "title" is used as the product name and "body" as the description.
  const apiEndpoint = "https://jsonplaceholder.typicode.com/posts";
  let products = [];
  let editingId = null;

  const statusEl = document.getElementById("status");
  const rowsEl = document.getElementById("rows");
  const nameEl = document.getElementById("pName");
  const descEl = document.getElementById("pDesc");

  function show(msg, type) { statusEl.textContent = msg; statusEl.className = type; }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  async function request(url, options) {
    const response = await fetch(url, options);
    if (!response.ok) throw new Error("Server returned " + response.status);   // fetch does not throw on 404/500
    return response.json();
  }

  // READ
  async function loadProducts() {
    try {
      products = await request(apiEndpoint + "?_limit=5");
      render();
      show("Loaded " + products.length + " products from the endpoint.", "ok");
    } catch (err) { show("Could not load data: " + err.message, "err"); }
  }

  function render() {
    rowsEl.innerHTML = products.map(p => `
      <tr><td>${p.id}</td><td>${esc(p.title)}</td><td>${esc(p.body)}</td>
      <td><button onclick="startEdit(${p.id})">Edit</button>
          <button class="del" onclick="removeProduct(${p.id})">Delete</button></td></tr>`).join("");
  }

  // CREATE or UPDATE
  document.getElementById("saveBtn").addEventListener("click", async () => {
    const title = nameEl.value.trim(), body = descEl.value.trim();
    if (title.length < 3 || body.length < 5) { show("Enter a product name (3+ chars) and description (5+ chars).", "err"); return; }
    const headers = { "Content-Type": "application/json; charset=UTF-8" };
    try {
      if (editingId === null) {
        const created = await request(apiEndpoint, { method: "POST", headers, body: JSON.stringify({ title, body, userId: 1 }) });
        created.id = Date.now() % 100000;      // the API always returns id 101, so make a local unique id
        products.unshift(created);
        show("Product added (POST).", "ok");
      } else {
        let updated = { title, body };
        // Products added in this session do not exist on the test API (ids above 100), so edit them locally only
        if (editingId <= 100) {
          updated = await request(apiEndpoint + "/" + editingId, { method: "PUT", headers, body: JSON.stringify({ id: editingId, title, body, userId: 1 }) });
        }
        products = products.map(p => p.id === editingId ? { ...p, title: updated.title, body: updated.body } : p);
        show("Product updated (PUT).", "ok");
      }
      render(); resetForm();
    } catch (err) { show("Save failed: " + err.message, "err"); }
  });

  function startEdit(id) {
    const p = products.find(x => x.id === id);
    editingId = id; nameEl.value = p.title; descEl.value = p.body;
    document.getElementById("formTitle").textContent = "Edit product #" + id;
    document.getElementById("saveBtn").textContent = "Save changes";
    document.getElementById("cancelBtn").hidden = false;
  }
  function resetForm() {
    editingId = null; nameEl.value = ""; descEl.value = "";
    document.getElementById("formTitle").textContent = "Add product";
    document.getElementById("saveBtn").textContent = "Add product";
    document.getElementById("cancelBtn").hidden = true;
  }
  document.getElementById("cancelBtn").addEventListener("click", resetForm);

  // DELETE (update the screen only after the server confirms)
  async function removeProduct(id) {
    try {
      await request(apiEndpoint + "/" + id, { method: "DELETE" });
      products = products.filter(p => p.id !== id);
      render(); show("Product deleted (DELETE).", "ok");
    } catch (err) { show("Delete failed: " + err.message, "err"); }
  }

  loadProducts();
</script>
</body>
</html>
